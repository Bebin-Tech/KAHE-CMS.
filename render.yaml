services:
  - type: web
    name: kahe-cms
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "cd backend/cms_project && gunicorn cms_project.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: NODE_VERSION
        value: 18.0.0
      - key: SECRET_KEY
        generateValue: true
      - key: RENDER
        value: "true"
      - key: PYTHONPATH
        value: "/opt/render/project/src/backend/cms_project"
      - key: DATABASE_URL
        fromDatabase:
          name: kahe-cms-db
          property: connectionString

databases:
  - name: kahe-cms-db
    plan: free
