services:
  # Backend Web Service
  - type: web
    name: kahe-cms-backend-v3
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kahe-cms-db-v3
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0

  # Frontend Static Site
  - type: static
    name: kahe-cms-frontend-v3
    rootDir: frontend
    buildCommand: npm install && npm run build
    publishDir: build
    envVars:
      - key: REACT_APP_API_URL
        fromService:
          type: web
          name: kahe-cms-backend-v3
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: kahe-cms-db-v3
    plan: free
