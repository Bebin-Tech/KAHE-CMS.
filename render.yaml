services:
  # Unified All-in-One Web Service
  - type: web
    name: kahe-cms-all-in-one-final
    runtime: python
    buildCommand: |
      npm install --prefix frontend && CI=false npm run build --prefix frontend
      pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kahe-cms-db-final
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.10.0
      - key: REACT_APP_API_URL
        value: ""

databases:
  - name: kahe-cms-db-final
    plan: free
