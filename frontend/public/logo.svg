<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
    <!-- Center of the entire SVG is (250, 250) -->

    <!-- Sunburst Icon Group -->
    <g transform="translate(250, 160)">
        <!-- Green Circular Segment Background -->
        <circle cx="0" cy="0" r="100" fill="#10a34d" />

        <!-- Sunburst Rays emanating from the bottom center -->
        <g stroke="white" stroke-width="4" stroke-linecap="round">
            <line x1="0" y1="80" x2="0" y2="-90" />
            <line x1="0" y1="80" x2="60" y2="-60" />
            <line x1="0" y1="80" x2="90" y2="0" />
            <line x1="0" y1="80" x2="70" y2="50" />
            <line x1="0" y1="80" x2="-60" y2="-60" />
            <line x1="0" y1="80" x2="-90" y2="0" />
            <line x1="0" y1="80" x2="-70" y2="50" />
            <line x1="0" y1="80" x2="30" y2="-80" />
            <line x1="0" y1="80" x2="-30" y2="-80" />
        </g>

        <!-- Stylized Open Book / Waves at the bottom of the circle -->
        <path d="M-110,80 Q-55,40 0,80 Q55,40 110,80 Q55,110 0,80 Q-55,110 -110,80 Z" fill="#10a34d" />
        <path d="M-110,80 Q-55,40 0,80 Q55,40 110,80" fill="none" stroke="white" stroke-width="4" />
        <path d="M-100,95 Q-50,55 0,95 Q50,55 100,95" fill="none" stroke="white" stroke-width="3" opacity="0.9" />
    </g>

    <!-- Tagline (Enable | Enlighten | Enrich) -->
    <text x="250" y="285" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="16" font-weight="600" fill="#333" text-anchor="middle" letter-spacing="0.5">Enable | Enlighten | Enrich</text>

    <!-- Main Title: KARPAGAM -->
    <text x="250" y="360" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="72" font-weight="900" fill="#1e293b" text-anchor="middle" letter-spacing="4">KARPAGAM</text>

    <!-- Sub Title: ACADEMY OF HIGHER EDUCATION -->
    <text x="250" y="405" font-family="'Segoe UI', Roboto, Arial, sans-serif" font-size="24" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1.5">ACADEMY OF HIGHER EDUCATION</text>

    <!-- Underline -->
    <line x1="150" y1="420" x2="350" y2="420" stroke="#10a34d" stroke-width="3" />
</svg>
